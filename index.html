<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SABHAN AI - مترجم الصور</title>
<style>
  body { font-family: Arial, sans-serif; background:#0f172a; color:#e2e8f0; display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1 { color:#a78bfa; }
  form { background:#1e293b; padding:20px; border-radius:12px; width:100%; max-width:420px; }
  label { display:block; margin:12px 0 6px; }
  input, select, button { width:100%; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; }
  button { background:#7c3aed; border:none; margin-top:16px; cursor:pointer; font-weight:bold; }
  button:disabled { opacity:.6; }
  #result { margin-top:24px; max-width:100%; }
  img { max-width:100%; border-radius:8px; }
  #status { margin-top:12px; color:#facc15; }
</style>
</head>
<body>
  <h1>SABHAN AI PRO</h1>
  <p>ترجمة الصور واستبدال النصوص</p>
  <form id="form">
    <label>الصورة</label>
    <input type="file" id="image" accept="image/*" required />

    <label>اللغة الهدف</label>
    <select id="lang">
      <option value="Arabic">العربية</option>
      <option value="English">الإنجليزية</option>
      <option value="French">الفرنسية</option>
      <option value="Spanish">الإسبانية</option>
      <option value="Turkish">التركية</option>
    </select>

    <button type="submit">ترجم الصورة</button>
  </form>
  <div id="status"></div>
  <div id="result"></div>

<script>
const form = document.getElementById('form');
const status = document.getElementById('status');
const result = document.getElementById('result');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('image').files[0];
  const lang = document.getElementById('lang').value;
  if (!file) return;

  status.textContent = 'جاري المعالجة... قد تستغرق ثوانٍ';
  result.innerHTML = '';

  const fd = new FormData();
  fd.append('image', file);
  fd.append('targetLang', lang);

  try {
    const res = await fetch('/api/translate', { method: 'POST', body: fd });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'فشل الطلب');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    result.innerHTML = `<img src="${url}" /><br/><a href="${url}" download="translated.png">تنزيل الصورة</a>`;
    status.textContent = 'تم بنجاح!';
  } catch (err) {
    status.textContent = 'خطأ: ' + err.message;
  }
});
</script>
</body>
</html>
